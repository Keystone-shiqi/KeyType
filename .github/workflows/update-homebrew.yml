name: Update Homebrew Tap

on:
  release:
    types: [published]

jobs:
  update-tap:
    runs-on: ubuntu-latest
    steps:
      - name: Get release info
        id: release
        run: |
          TAG="${{ github.event.release.tag_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download DMG and compute SHA256
        id: sha
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          URL="https://github.com/Keystone-shiqi/keytype/releases/download/v${VERSION}/KeyType-v${VERSION}-cloud.dmg"
          echo "Downloading $URL"
          curl -fSL -o keytype.dmg "$URL"
          SHA=$(sha256sum keytype.dmg | awk '{print $1}')
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "SHA256: $SHA"

      - name: Update tap repo
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${{ steps.release.outputs.version }}"
          SHA="${{ steps.sha.outputs.sha256 }}"

          git clone https://x-access-token:${TAP_TOKEN}@github.com/Keystone-shiqi/homebrew-keytype.git tap
          cd tap

          # Update version, sha256, and URL in Cask file
          sed -i "s/version \".*\"/version \"${VERSION}\"/" Casks/keytype.rb
          sed -i "s/sha256 \".*\"/sha256 \"${SHA}\"/" Casks/keytype.rb
          # Ensure URL uses cloud DMG naming
          sed -i "s|KeyType-v#{version}\.dmg|KeyType-v#{version}-cloud.dmg|g" Casks/keytype.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/keytype.rb
          git commit -m "bump: KeyType v${VERSION}"
          git push origin main
